# Rebuilds the study with fresh market data after every US trading day and
# publishes web/ as the public website (GitHub Pages).
# No API key is needed: news is scored with VADER, and earlier Claude scores
# are reused from data/llm_scores.json.
name: Update website

on:
  schedule:
    - cron: "30 22 * * 1-5"   # 22:30 UTC, after the US close
  workflow_dispatch: {}        # "Run workflow" button on GitHub

permissions:
  contents: write   # save the growing news archive back to the repo
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Download data and rerun the study
        working-directory: src
        run: python -u build.py --refresh
      - name: Leak test
        run: python tests/test_no_lookahead.py
      - name: Save the news archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news_archive.jsonl
          git diff --cached --quiet || (git commit -m "Daily news archive $(date -u +%F)" && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
